name: ci-cd

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer les dépendances
        run: python -m pip install -r requirements.txt
      - name: Tests
        run: python -m pytest -q
      - name: Construire l'image
        run: docker build --build-arg APP_VERSION=${{ github.sha }} -t application-tp:ci .
      - name: Démarrer l'image et contrôler /health
        run: |
          docker run -d --name app-ci -p 8080:8000 application-tp:ci
          for i in $(seq 1 30); do
            curl -fs http://localhost:8080/health && exit 0
            sleep 1
          done
          docker logs app-ci
          exit 1

  publish:
    # Jamais sur une pull request
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - name: Nom d'image en minuscules
        id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Construire et publier
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: APP_VERSION=${{ github.sha }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
      - name: Afficher le digest
        run: echo "${{ steps.meta.outputs.image }}@${{ steps.build.outputs.digest }}"

  deploy:
    needs: publish
    runs-on: ubuntu-24.04 # runner auto-hébergé si la VM est dans le réseau de l'école
    environment: preproduction
    steps:
      - uses: actions/checkout@v4
      - name: Préparer SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - name: Déployer par digest
        run: |
          SSH="ssh -i ~/.ssh/id_deploy -p ${{ secrets.DEPLOY_PORT }} -o StrictHostKeyChecking=yes ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}"
          scp -i ~/.ssh/id_deploy -P ${{ secrets.DEPLOY_PORT }} deploy.sh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:~/deploy.sh
          $SSH "chmod +x ~/deploy.sh && ~/deploy.sh '${{ needs.publish.outputs.image }}@${{ needs.publish.outputs.digest }}' '${{ github.sha }}'"
